<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layouit na Prática!</title>
    <style>
        div.container{
            border: 3px solid blue;
            height: 250px;
            display: grid;

            /*grid-template-columns:auto auto auto;
            grid-template-rows: auto auto auto;
            O código acima foi resumido na linha abaixo (grid-tempĺate)*/

            /*align-items: start;
            justify-items: center;
            O código acima foi resumido na linha abaixo (place-items)*/

            /*align-content:space-between;
            justify-content: end;
            O código acima foi resumido na linha abaixo (place-content)*/

            grid-template: repeat(3,auto) / repeat(3,auto);
            gap: 10px;
            place-items: start center;
            place-content: space-between end;
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }

    </style>
</head>
<body>

    <div class="container">

        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>

    </div>
    
</body>
</html>
